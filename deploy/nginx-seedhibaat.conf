server {
    listen 80;
    server_name wa.example.com;
    client_max_body_size 4m;

    location = /healthz {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /webhooks/meta {
        limit_except GET POST { deny all; }
        # GET verification carries the secret verify token in its query string.
        access_log off;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location = /webhooks/shopify {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location /r/ {
        limit_except GET { deny all; }
        # Signed per-recipient redirect tokens must not enter Nginx logs.
        access_log off;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        limit_except GET { deny all; }
        alias /opt/seedhibaat/media/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff";
    }

    location = /metrics {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /metrics/assets/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { return 404; }
}
